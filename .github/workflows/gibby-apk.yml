name: Gibby APK (private debug build)

# Private sideload build. Not for store publishing.
# Installs as com.hermesagent.hermes_android.dev (debug applicationIdSuffix).
# Run manually: Actions tab > "Gibby APK (private debug build)" > Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [gibby-wake]

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7

      # A stable debug signing key lets a new APK update the one already on the
      # phone. If the cache is evicted (unused for 7 days) Android will refuse
      # the update; uninstall the old build first in that case.
      - name: Restore stable debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: gibby-debug-keystore-v1

      - name: Voice-input tooling tests
        run: python3 -m unittest scripts.test_prepare_voice_inputs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - run: flutter pub get

      - name: Hands-free voice unit tests (Dart)
        run: flutter test test/hands_free_voice_platform_test.dart test/hands_free_conversation_controller_test.dart

      - name: Build debug APK (arm64-v8a)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Print APK SHA-256
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gibby-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
