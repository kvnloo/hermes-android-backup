[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mobile-push-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.165.0,<1", "pywebpush>=2.5.0,<3", "cryptography>=44,<51", "dnspython>=2.9.2,<3"]

[project.optional-dependencies]
test = ["pytest>=9.2.0,<10", "httpx>=0.28.1,<1", "ruff>=0.17.6,<1", "uvicorn>=0.54.0,<1"]

[tool.setuptools]
packages = ["mobile_push"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
